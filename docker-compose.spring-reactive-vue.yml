services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: spring_reactive
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./spring-reactive
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # SecurityConfig's OAuth2 client registration requires these placeholders to
      # resolve at startup even though the M2M flow isn't exercised locally.
      API_CLIENT_ID: unused
      API_CLIENT_SECRET: unused
      # WebClientConfig's countriesWebClient bean requires this placeholder to
      # resolve at startup even if country lookups aren't exercised locally.
      RESTCOUNTRIES_API_KEY: unused
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/api-docs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./vue-app
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:

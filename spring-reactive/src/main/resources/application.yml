spring:
  application:
    name: spring-reactive
  graphql:
    graphiql:
      enabled: true
  codec:
    max-in-memory-size: 2MB
  security:
    oauth2:
      client:
        registration:
          my-api:
            authorization-grant-type: client_credentials
            client-id: ${api-client-id}
            client-secret: ${api-client-secret}
        provider:
          my-api:
            token-uri: https://your-auth-server.example.com/oauth2/token
  ai:
    mcp:
      server:
        name: spring-reactive-mcp-server
        version: 0.0.1
        type: ASYNC
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true

app:
  http-client:
    timeout: 10s
    retry:
      enabled: true
      max-retries: 2
      initial-backoff: 200ms
      max-backoff: 2s
      jitter: 0.5
      idempotent-only: true

logging:
  level:
    com.tiltedev: DEBUG
